spring.application.name=effective-menu-service
server.port=${SERVER_PORT:8081}
spring.datasource.url=${EFFECTIVE_MENU_DB_URL:jdbc:postgresql://127.0.0.1:5433/effective_menu_db}
spring.datasource.username=${EFFECTIVE_MENU_DB_USERNAME:effective_menu_app}
spring.datasource.password=${EFFECTIVE_MENU_DB_PASSWORD:effective_menu_password}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
management.endpoints.web.exposure.include=health,info


spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP:effective-menu-read-model}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
app.kafka.menu-item-changed-topic=${MENU_ITEM_CHANGED_TOPIC:catalog.menu-item.changed}


spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
app.kafka.menu-item-changed-dlt=${MENU_ITEM_CHANGED_DLT:catalog.menu-item.changed.DLT}