spring.application.name=effective-menu-service
server.port=${SERVER_PORT:8081}
spring.datasource.url=${EFFECTIVE_MENU_DB_URL:jdbc:postgresql://127.0.0.1:5433/effective_menu_db}
spring.datasource.username=${EFFECTIVE_MENU_DB_USERNAME:effective_menu_app}
spring.datasource.password=${EFFECTIVE_MENU_DB_PASSWORD:effective_menu_password}
spring.datasource.hikari.maximum-pool-size=${EFFECTIVE_MENU_DB_MAX_POOL_SIZE:30}
spring.datasource.hikari.minimum-idle=${EFFECTIVE_MENU_DB_MIN_IDLE:10}
spring.datasource.hikari.connection-timeout=${EFFECTIVE_MENU_DB_CONNECTION_TIMEOUT_MS:30000}

# Redis is used as a fast cache for customer menu snapshots.
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:127.0.0.1}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.timeout=${SPRING_DATA_REDIS_TIMEOUT:2s}
app.effective-menu-cache.enabled=${EFFECTIVE_MENU_CACHE_ENABLED:true}
app.effective-menu-cache.key-prefix=${EFFECTIVE_MENU_CACHE_KEY_PREFIX:effective-menu:outlet:}
app.effective-menu-cache.ttl=${EFFECTIVE_MENU_CACHE_TTL:60s}

# Compress JSON responses so large effective menus use less network bandwidth.
server.compression.enabled=${EFFECTIVE_MENU_HTTP_COMPRESSION_ENABLED:false}
server.compression.mime-types=application/json,application/*+json,text/plain
server.compression.min-response-size=1024
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
management.endpoints.web.exposure.include=health,info,metrics


spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP:effective-menu-read-model}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
app.kafka.menu-item-changed-topic=${MENU_ITEM_CHANGED_TOPIC:catalog.menu-item.changed}


spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
app.kafka.menu-item-changed-dlt=${MENU_ITEM_CHANGED_DLT:catalog.menu-item.changed.DLT}


app.effective-menu-cache.lock-enabled=${EFFECTIVE_MENU_CACHE_LOCK_ENABLED:true}
app.effective-menu-cache.lock-ttl=${EFFECTIVE_MENU_CACHE_LOCK_TTL:5s}
app.effective-menu-cache.lock-wait-timeout=${EFFECTIVE_MENU_CACHE_LOCK_WAIT_TIMEOUT:2s}
app.effective-menu-cache.lock-retry-interval=${EFFECTIVE_MENU_CACHE_LOCK_RETRY_INTERVAL:50ms}

management.endpoint.health.probes.enabled=true
management.endpoint.health.show-components=always
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db,kafka
